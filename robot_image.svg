<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Body -->
  <rect x="50" y="60" width="100" height="80" rx="10" fill="#667eea" stroke="#4caf50" stroke-width="3"/>
  
  <!-- Robot Head -->
  <circle cx="100" cy="50" r="30" fill="#667eea" stroke="#4caf50" stroke-width="3"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="45" r="5" fill="#4caf50"/>
  <circle cx="110" cy="45" r="5" fill="#4caf50"/>
  
  <!-- Antenna -->
  <line x1="100" y1="20" x2="100" y2="35" stroke="#4caf50" stroke-width="3"/>
  <circle cx="100" cy="20" r="5" fill="#4caf50"/>
  
  <!-- Arms -->
  <rect x="30" y="70" width="20" height="30" rx="5" fill="#667eea" stroke="#4caf50" stroke-width="2"/>
  <rect x="150" y="70" width="20" height="30" rx="5" fill="#667eea" stroke="#4caf50" stroke-width="2"/>
  
  <!-- Legs -->
  <rect x="70" y="140" width="20" height="30" rx="5" fill="#667eea" stroke="#4caf50" stroke-width="2"/>
  <rect x="110" y="140" width="20" height="30" rx="5" fill="#667eea" stroke="#4caf50" stroke-width="2"/>
  
  <!-- Chest Panel -->
  <rect x="70" y="80" width="60" height="40" rx="5" fill="#4caf50" opacity="0.3"/>
  <text x="100" y="105" font-family="Arial" font-size="20" font-weight="bold" fill="#4caf50" text-anchor="middle">008</text>
</svg>

